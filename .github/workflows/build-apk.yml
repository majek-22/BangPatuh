name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          JAVA_MAJOR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"
          if [ -z "${JAVA_MAJOR}" ]; then
            echo "ERROR: Failed to detect active Java version."
            exit 1
          fi
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Active version is ${JAVA_MAJOR}."
            exit 1
          fi
          echo "Java environment verification passed (version ${JAVA_MAJOR})."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${APK_PATH}" ]; then
            echo "ERROR: ${APK_PATH} was not found!"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${APK_PATH}" ]; then
            echo "ERROR: APK file ${APK_PATH} is empty."
            exit 1
          fi

          case "${APK_PATH}" in
            *.apk) ;;
            *)
              echo "ERROR: ${APK_PATH} does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK verified successfully: ${APK_PATH} ($(stat -c%s "${APK_PATH}") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="${ASSET_DIR}/app-debug.apk"
          cp "${SRC_APK}" "${DEST_APK}"
          if [ ! -f "${DEST_APK}" ] || [ ! -s "${DEST_APK}" ]; then
            echo "ERROR: Failed to prepare release asset ${DEST_APK}."
            exit 1
          fi
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${DEST_APK}"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "${RELEASE_ASSET}" ]; then
            echo "ERROR: Release asset does not exist: ${RELEASE_ASSET}"
            exit 1
          fi
          if [ ! -s "${RELEASE_ASSET}" ]; then
            echo "ERROR: Release asset is empty: ${RELEASE_ASSET}"
            exit 1
          fi
          case "${RELEASE_ASSET}" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension."
              exit 1
              ;;
          esac
          ASSET_FILENAME=$(basename "${RELEASE_ASSET}")
          if [ "${ASSET_FILENAME}" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be app-debug.apk, got ${ASSET_FILENAME}."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "${RELEASE_TAG}" \
            "${RELEASE_ASSET}" \
            --title "${RELEASE_TITLE}" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "This is an automatically generated debug APK built by GitHub Actions.

- Run number: ${{ github.run_number }}
- Run attempt: ${{ github.run_attempt }}
- Source commit: ${{ github.sha }}

Notes:
- This APK is intended for testing purposes.
- This is not a Play Store production release.
- The APK is signed only with a temporary debug keystore."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            DIRECT_APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

            echo "=== RELEASE SUCCESS ==="
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Name: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_APK_URL}"
            echo "GitHub Actions backup artifact 'app-debug-apk' remains available."

            echo "## DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk](${DIRECT_APK_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Permanent Direct Download Link:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`${DIRECT_APK_URL}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Actions artifact \`app-debug-apk\` also remains available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available for download."
            fi
            echo "The new APK cannot be confirmed at the latest release direct download link until a release succeeds."
          fi
