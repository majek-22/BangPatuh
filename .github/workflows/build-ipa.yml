name: Build iOS IPA (Capacitor/Web)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Proyek Web
        run: npm run build --if-present

      - name: Jalankan Capacitor Sync
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Kompilasi Xcode ke Simulator Build (Tanpa Akun Developer Berbayar)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphonesimulator \
                     derivedDataPath build
                     
      - name: Kemas Menjadi Struktur IPA (.zip ke .ipa)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphonesimulator/App.app Payload/
          zip -r aplikasi.ipa Payload/

      - name: Upload IPA ke GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-iOS-IPA
          path: aplikasi.ipa
